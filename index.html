<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">ShopEase</div>
        <nav>
            <a href="#products">Products</a>
            <a href="#cart-section">Cart</a>
            <a href="#auth-section">Account</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <section id="products">
        <h2>Our Products</h2>
        <div id="product-list"></div>
    </section>

    <section class="cart-section" id="cart-section">
        <h2>Your Cart</h2>
        <div id="cart-items"><p>Your cart is empty.</p></div>
        <p id="cart-total"></p>
        <button onclick="checkout()">Place Order</button>
        <p id="order-message"></p>
    </section>

    <section id="auth-section">
        <h2>Account</h2>

        <div id="auth-forms">
            <h3>Register</h3>
            <p><input id="reg-username" placeholder="Username"></p>
            <p><input id="reg-email" placeholder="Email"></p>
            <p><input id="reg-password" type="password" placeholder="Password (min 6 characters)"></p>
            <p><button onclick="registerUser()">Register</button></p>

            <h3>Login</h3>
            <p><input id="login-username" placeholder="Username"></p>
            <p><input id="login-password" type="password" placeholder="Password"></p>
            <p><button onclick="loginUser()">Login</button></p>
        </div>

        <div id="user-info" style="display: none;">
            <p>Logged in as <strong id="user-name"></strong></p>
            <button onclick="logoutUser()">Logout</button>
        </div>

        <p id="auth-message"></p>
    </section>

    <section id="about">
        <h2>About ShopEase</h2>
        <p>Your destination for simple and convenient online shopping.</p>
    </section>

    <footer>
        <p>© 2026 ShopEase. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
